<title>ページが見つかりません｜磯部医院</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
  :root{
    --bg:#FBFBF6; --sky:#7EB8D6; --sky-deep:#4A8DB8; --mint:#8FD4C1; --mint-deep:#5FB9A0;
    --coral:#FF9E85; --ink:#2C3A36; --ink-soft:#5C6D67; --white:#FFFFFF;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    font-family:'Noto Sans JP', sans-serif; background:var(--bg); color:var(--ink);
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:24px; text-align:center; line-height:1.8;
  }
  .box{max-width:440px;}
  .logo{width:88px;height:88px;margin:0 auto 24px;}
  .logo img{width:100%;height:100%;object-fit:contain;}
  h1{
    font-family:'Zen Maru Gothic',sans-serif; font-size:70px; font-weight:900;
    background:linear-gradient(135deg,var(--sky-deep),var(--mint-deep));
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:1; margin-bottom:12px;
  }
  h2{font-family:'Zen Maru Gothic',sans-serif; font-size:19px; font-weight:700; margin-bottom:14px;}
  p{color:var(--ink-soft); font-size:14px; margin-bottom:30px;}
  .actions{display:flex;flex-direction:column;gap:12px;align-items:center;}
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:14px 28px; border-radius:999px;
    font-weight:700; font-size:14px; text-decoration:none; font-family:'Zen Maru Gothic',sans-serif;
    transition:transform .25s ease;
  }
  .btn:hover{transform:translateY(-2px);}
  .btn-primary{background:var(--coral); color:var(--white); box-shadow:0 10px 22px rgba(255,158,133,.35);}
  .btn-outline{background:transparent; color:var(--ink); border:2px solid rgba(44,58,54,.15);}
</style>
